[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Multi-agent research system backend"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.1.0",
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "python-dotenv==1.0.0",
    "pydantic==2.7.0",
    "httpx==0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
